<!doctype html>
<html lang="en">
<head>
	<!-- charset FIRST, and inside the first 1024 bytes: the deployed host serves
	     without a charset header, so a document that doesn't declare one is decoded
	     as Windows-1252. -->
	<meta charset="utf-8">
	<!-- Router.activate() writes the real title on every navigation; this is what
	     the tab reads during the walk, before the first page resolves. -->
	<title>Résumé — lew42</title>
	<link rel="icon" type="image/png" href="/assets/img/favicon.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- THIS PAGE'S OWN CARD. Without this file, express falls back to the site
	     root's index.html and /resume/ unfurls as the framework homepage — wrong
	     title, wrong description. NOT generated: one page with one description
	     does not need a stamper (see blog/meta.mjs for the version that earns one).
	     The line below is the homepage's own /resume/ section desc (public/page.js),
	     restated here rather than reworded a second way.
	     ⚠ No og:image: no committed picture belongs to this page yet, and a
	       borrowed one (or a screenshot) would be a second thing to keep true. -->
	<meta name="description" content="Design engineer, 12+ years — and a 3D parallax scroll running underneath it.">
	<link rel="canonical" href="https://lew42.com/resume/">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="lew42">
	<meta property="og:title" content="Résumé">
	<meta property="og:description" content="Design engineer, 12+ years — and a 3D parallax scroll running underneath it.">
	<meta property="og:url" content="https://lew42.com/resume/">

	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="Résumé">
	<meta name="twitter:description" content="Design engineer, 12+ years — and a 3D parallax scroll running underneath it.">

	<script type="module" src="/app.js"></script>
</head>
<body></body>
</html>
