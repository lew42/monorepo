<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .b{fill:#f4f6fb;stroke:#5b6b8c;stroke-width:1.5}
    .h{fill:#fff4e0;stroke:#c98a1b;stroke-width:1.5}
    .f{fill:#eef8ee;stroke:#4d8a52;stroke-width:1.5}
    .t{fill:#1d2433;font-weight:600}
    .s{fill:#4a5268;font-size:11.5px}
    .m{font-family:ui-monospace,monospace;font-size:11px;fill:#2d4a2f}
    .a{stroke:#5b6b8c;stroke-width:1.5;fill:none;marker-end:url(#m)}
    .d{stroke:#4d8a52;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5b6b8c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4d8a52"/></marker>
  </defs>

  <!-- 1 the button -->
  <rect class="h" x="20" y="20" width="220" height="110" rx="10"/>
  <text class="t" x="34" y="44">1  Press ✦</text>
  <text class="s" x="34" y="66">New session, or continue one from</text>
  <text class="s" x="34" y="82">"Recent sessions" (summaries).</text>
  <text class="s" x="34" y="104">It remembers its HOME page, then</text>
  <text class="s" x="34" y="120">follows you; the mic never stops.</text>

  <!-- 2 assistants -->
  <rect class="b" x="300" y="20" width="220" height="110" rx="10"/>
  <text class="t" x="314" y="44">2  Two assistants</text>
  <text class="s" x="314" y="66">Fast: puts your words on screen.</text>
  <text class="s" x="314" y="86">Smart: hears it all, decides,</text>
  <text class="s" x="314" y="102">launches masterminds, routes</text>
  <text class="s" x="314" y="118">technical questions.</text>

  <!-- 3 directory mastermind -->
  <rect class="b" x="580" y="20" width="220" height="110" rx="10"/>
  <text class="t" x="594" y="44">3  Directory mastermind</text>
  <text class="s" x="594" y="66">Started fresh for one folder,</text>
  <text class="s" x="594" y="82">from its readme chain. Reused for</text>
  <text class="s" x="594" y="98">follow-ups; builds with minions;</text>
  <text class="s" x="594" y="114">a merge updates the readme.</text>

  <!-- files -->
  <rect class="f" x="20" y="190" width="500" height="150" rx="10"/>
  <text class="t" x="34" y="214">Where it is saved</text>
  <text class="m" x="34" y="240">&lt;home page&gt;/ai/&lt;session&gt;.jsonl</text>
  <text class="s" x="290" y="240">the whole session: every line, in order</text>
  <text class="m" x="34" y="264">&lt;home page&gt;/ai/&lt;session&gt;.summary</text>
  <text class="s" x="290" y="264">its title + gist (the Recent list)</text>
  <text class="m" x="34" y="288">&lt;any page&gt;/page.jsonl</text>
  <text class="s" x="290" y="288">ONE pointer line per session that</text>
  <text class="s" x="290" y="304">started or passed through here</text>
  <text class="s" x="34" y="328">Every line is stamped with the page it was said on.</text>

  <!-- 4 follow -->
  <rect class="b" x="580" y="190" width="220" height="150" rx="10"/>
  <text class="t" x="594" y="214">4  Servex follow(path)</text>
  <text class="s" x="594" y="236">Watches the files and sends each</text>
  <text class="s" x="594" y="252">change to the agents subscribed</text>
  <text class="s" x="594" y="268">to that path: one message per</text>
  <text class="s" x="594" y="284">burst. Agents never tail files;</text>
  <text class="s" x="594" y="300">minions coordinate through a</text>
  <text class="s" x="594" y="316">shared log.</text>

  <!-- find -->
  <rect class="h" x="20" y="370" width="780" height="46" rx="10"/>
  <text class="t" x="34" y="398">Find your work:  ✦ → Recent sessions (all)   ·   a page's AI tab → the sessions started or discussed on that page</text>

  <path class="a" d="M240,75 H298"/>
  <path class="a" d="M520,75 H578"/>
  <path class="a" d="M130,130 V188"/>
  <path class="d" d="M520,265 H578"/>
  <path class="d" d="M690,188 V132"/>
</svg>
