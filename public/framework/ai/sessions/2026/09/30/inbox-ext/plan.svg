<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Montserrat, Arial, sans-serif">
  <rect width="1200" height="700" fill="#f1f1f1"/>
  <!-- title + tabs -->
  <text x="40" y="62" font-size="40" font-weight="800" fill="#333">AI</text>
  <text x="120" y="60" font-size="17" font-weight="700" fill="#e8663d">INBOX</text>
  <rect x="112" y="68" width="76" height="3" fill="#e8663d"/>
  <text x="210" y="60" font-size="17" fill="#555">LOG</text>
  <text x="275" y="60" font-size="17" fill="#555">SYSTEM</text>
  <text x="380" y="60" font-size="14" fill="#888">← AI 2's inbox, moved here as the default tab. AI 2 stays as v1.</text>
  <!-- rail -->
  <rect x="40" y="90" width="330" height="580" fill="#fff" stroke="#ddd"/>
  <text x="56" y="116" font-size="13" font-weight="700" fill="#333">AI INBOX</text>
  <rect x="56" y="128" width="298" height="46" fill="#fff4ee" stroke="#e8663d" stroke-dasharray="4 3"/>
  <text x="64" y="148" font-size="12" fill="#b34a24">usage meters: ONLY on the AI rail subclass</text>
  <text x="64" y="165" font-size="12" fill="#b34a24">class AIRail extends InboxRail</text>
  <rect x="56" y="184" width="90" height="26" fill="#eee" stroke="#ccc"/><text x="64" y="202" font-size="12">+ New card</text>
  <rect x="154" y="184" width="100" height="26" fill="#eee" stroke="#ccc"/><text x="162" y="202" font-size="12">☐ Needs you  (filter)</text>
  <rect x="262" y="184" width="92" height="26" fill="#fff" stroke="#ccc"/><text x="270" y="202" font-size="12" fill="#999">Search…</text>
  <g font-size="13">
    <rect x="56" y="222" width="298" height="70" fill="#fafafa" stroke="#e5e5e5"/>
    <circle cx="70" cy="240" r="5" fill="#e8663d"/><text x="84" y="245" font-weight="700">Now: one inbox everywhere</text>
    <text x="84" y="265" fill="#777">refined prompt · unread</text>
    <rect x="56" y="300" width="298" height="70" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="84" y="325" font-weight="700">Dictation: one widget…</text><text x="84" y="345" fill="#777">read · archive ×</text>
    <rect x="56" y="378" width="298" height="70" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="84" y="403" font-weight="700">Audio: six tools become three</text><text x="84" y="423" fill="#777">auto-resolved</text>
  </g>
  <text x="56" y="650" font-size="12" fill="#888">views · notes · archived</text>
  <!-- card -->
  <rect x="390" y="90" width="770" height="580" fill="#fff" stroke="#ddd"/>
  <text x="414" y="130" font-size="24" font-weight="700" fill="#333">Now: one inbox everywhere</text>
  <text x="414" y="156" font-size="13" fill="#777">/framework/ai/2026/09/30/now-one-inbox-…/  — a card is a page, its own url</text>
  <rect x="414" y="176" width="720" height="160" fill="#f7f7f7" stroke="#e5e5e5"/>
  <text x="430" y="200" font-size="13" fill="#555">Refined prompt (raw → structured), and a live preview of what it references</text>
  <text x="430" y="224" font-size="13" fill="#555">(#Page, /path, a screenshot)</text>
  <text x="414" y="370" font-size="13" fill="#555">The conversation continues in the card's sidebar (Dictate chat) — chat mode informal, the card is page mode.</text>
  <!-- ext -->
  <rect x="414" y="410" width="720" height="230" fill="#eef4ff" stroke="#9bb5e6"/>
  <text x="430" y="438" font-size="15" font-weight="700" fill="#2d4f8f">core/Page/ext/ — any page can use an extension</text>
  <text x="430" y="464" font-size="13" fill="#2d4f8f">page.jsonl line  {"ext": "Inbox"}  → loads core/Page/ext/Inbox/, calls its setup(page)</text>
  <text x="430" y="488" font-size="13" fill="#2d4f8f">hooks, like Server plugins:  page.on("line") · page.on("render")</text>
  <text x="430" y="512" font-size="13" fill="#2d4f8f">message a page = append {"inbox": {type, author, text, at}} to its page.jsonl</text>
  <text x="430" y="548" font-size="13" fill="#2d4f8f">InboxRail (base class: previews, pill, search, filters, detail + sub column)</text>
  <text x="450" y="572" font-size="13" fill="#2d4f8f">├ AIRail  — + usage meters, + New card, auto-transcribe   (Inbox tab, AI 2)</text>
  <text x="450" y="596" font-size="13" fill="#2d4f8f">└ LogRail — every task, status dot; same rows, same card on click   (Log tab)</text>
</svg>
