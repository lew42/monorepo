<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui, sans-serif" font-size="14">
  <style>.box{fill:#fff;stroke:#333;stroke-width:1.5;rx:8}.wave{fill:#f4f1ec;stroke:#999;stroke-dasharray:4 3;rx:12}.t{fill:#222}.h{font-weight:700}.s{fill:#666;font-size:12}</style>
  <rect class="wave" x="10" y="20" width="440" height="260"/><text class="t h" x="24" y="44">Wave A — main is production (3 minions, parallel)</text>
  <rect class="box" x="24" y="60" width="200" height="60"/><text class="t h" x="34" y="82">monitor</text><text class="s" x="34" y="100">health.mjs: template change → load,</text><text class="s" x="34" y="114">console, shot, stall &gt; 2 s · one supervisor</text>
  <rect class="box" x="24" y="135" width="200" height="60"/><text class="t h" x="34" y="157">validated-writes</text><text class="s" x="34" y="175">append.mjs / append_log validate the</text><text class="s" x="34" y="189">schema → then wire jsonl-guard</text>
  <rect class="box" x="24" y="210" width="200" height="60"/><text class="t h" x="34" y="232">verbs-reader</text><text class="s" x="34" y="250">JSONL.js knows experiment + review;</text><text class="s" x="34" y="264">flat lines render plain, no warning</text>
  <rect class="box" x="245" y="135" width="190" height="60"/><text class="t h" x="255" y="157">merge, one at a time</text><text class="s" x="255" y="175">review gate · smoke · 4 widths</text><text class="s" x="255" y="189">→ michael/dev (the live site)</text>
  <path d="M224 90 L245 160 M224 165 L245 165 M224 240 L245 170" stroke="#333" fill="none"/>
  <rect class="wave" x="470" y="20" width="480" height="260"/><text class="t h" x="484" y="44">Wave B — proposals become tasks, node-led</text>
  <rect class="box" x="484" y="60" width="210" height="60"/><text class="t h" x="494" y="82">Proposal class</text><text class="s" x="494" y="100">any minion proposes → mastermind reviews,</text><text class="s" x="494" y="114">decides → a task with steps · Inbox item</text>
  <rect class="box" x="484" y="135" width="210" height="60"/><text class="t h" x="494" y="157">node-led task loop</text><text class="s" x="494" y="175">Servex tracks every step, re-prompts;</text><text class="s" x="494" y="189">phased UI feedback uses it</text>
  <rect class="box" x="484" y="210" width="210" height="60"/><text class="t h" x="494" y="232">merge rows + revert</text><text class="s" x="494" y="250">diff · review · shots on the card;</text><text class="s" x="494" y="264">foundational budgets never stop</text>
  <rect class="box" x="715" y="60" width="220" height="60"/><text class="t h" x="725" y="82">template weights</text><text class="s" x="725" y="100">importer count + use_template()</text>
  <rect class="box" x="715" y="135" width="220" height="60"/><text class="t h" x="725" y="157">one page.jsonl</text><text class="s" x="725" y="175">archive old log lines on an interval;</text><text class="s" x="725" y="189">items → promote(id) → own directory</text>
  <rect class="box" x="715" y="210" width="220" height="60"/><text class="t h" x="725" y="232">session focus</text><text class="s" x="725" y="250">refinement to the selected card</text>
  <path d="M450 150 L470 150" stroke="#333" fill="none"/>
</svg>
