<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>devbar-chat test harness — not a real page, never linked</title>
<link rel="stylesheet" href="/framework/framework.css">
<link rel="stylesheet" href="/framework/dev/DevBar/devbar.css">
<link rel="stylesheet" href="./chat-test.css">
<style>
	/* The harness's own frame, not the app's — just enough of .dev-bar's own
	   shell (colour-scheme, surface, the column layout, the rail's own
	   font-size) for the chat tab to size itself exactly as it will for real,
	   without pulling in DevBar.js/tools.js/grip/claim. */
	body { margin: 0; background: #ddd; font-family: sans-serif; }
	.rig { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; align-items: flex-start; }
	.frame { border: 2px dashed #999; }
	.frame > .dev-bar {
		position: static;
		color-scheme: dark;
		color: var(--ink);
		background: var(--surface);
		font-family: var(--mono);
		font-size: 0.8rem;
		transform: none; visibility: visible;
	}
	.dev-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0.9em; }
	.label { font: 12px/1.4 sans-serif; color: #333; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="rig">
	<div>
		<div class="label">1280-equivalent rail (340 × 700)</div>
		<div class="frame" style="width:340px; height:700px;">
			<div class="dev-bar flex v" style="width:340px; height:700px;" id="rail-a"></div>
		</div>
	</div>
	<div>
		<div class="label">250px head-note (not the path bar — that's a separate harness)</div>
		<div class="frame" style="width:250px; height:700px;">
			<div class="dev-bar flex v" style="width:250px; height:700px;" id="rail-b"></div>
		</div>
	</div>
	<div>
		<div class="label">bottom-sheet-equivalent (390 wide × 300 tall, ~45dvh at a phone)</div>
		<div class="frame" style="width:390px; height:300px;">
			<div class="dev-bar flex v" style="width:390px; height:300px;" id="rail-c"></div>
		</div>
	</div>
</div>

<script type="module">
	import { div } from "/framework/core/View/View.js";
	import chat from "/framework/dev/DevBar/chat.js";

	// One shell per rig — just the tabs strip + body, so the chat tab renders
	// exactly where it will in the real bar (`.dev-body`'s the direct parent).
	for (const id of ["rail-a", "rail-b", "rail-c"]) {
		const rail = document.getElementById(id);
		const body = document.createElement("div");
		body.className = "dev-body flex v";
		rail.appendChild(body);
		chat(null)?.append_to(body);
	}
</script>

</body>
</html>
