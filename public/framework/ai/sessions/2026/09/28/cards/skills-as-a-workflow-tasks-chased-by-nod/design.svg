<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="system-ui, sans-serif" font-size="14">
<style>.b{fill:#8881;stroke:#888;stroke-width:1.5}.t{fill:#666;font-size:12px}.h{font-weight:600}.a{stroke:#888;stroke-width:1.5;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#888"/></marker></defs>
<text x="10" y="22" class="h">A task's life, kept by Servex's task loop (node), not by the agent remembering</text>
<rect class="b" x="10" y="50" width="130" height="56" rx="6"/><text x="22" y="74" class="h">open</text><text x="22" y="94" class="t">spawn writes line 1</text>
<rect class="b" x="180" y="50" width="130" height="56" rx="6"/><text x="192" y="74" class="h">working</text><text x="192" y="94" class="t">hooks log every edit</text>
<rect class="b" x="350" y="50" width="130" height="56" rx="6"/><text x="362" y="74" class="h">quiet 20 min</text><text x="362" y="94" class="t">or ended unlanded</text>
<rect class="b" x="520" y="50" width="130" height="56" rx="6"/><text x="532" y="74" class="h">chased</text><text x="532" y="94" class="t">"land, or say why"</text>
<rect class="b" x="700" y="20" width="190" height="56" rx="6"/><text x="712" y="44" class="h">landed</text><text x="712" y="64" class="t">finish-task, then node checks</text>
<rect class="b" x="700" y="110" width="190" height="56" rx="6"/><text x="712" y="134" class="h">waiting on you</text><text x="712" y="154" class="t">after 2 chases, never lost</text>
<path class="a" d="M140,78H178"/><path class="a" d="M310,78H348"/><path class="a" d="M480,78H518"/><path class="a" d="M650,70L698,50"/><path class="a" d="M650,88L698,132"/><path class="a" d="M585,106C585,150 245,150 245,108"/>
<text x="330" y="168" class="t">answers → working again</text>
<text x="10" y="210" class="t">Only an explicit landing, or the owner, closes a task. The words stay the agent's; the bookkeeping is node's.</text>
</svg>
